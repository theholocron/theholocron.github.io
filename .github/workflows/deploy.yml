# Hand-maintained — this repo IS the GitHub Pages site. The deploy-docs
# reusable workflow targets monorepos with <name>-site packages and uploads
# docs/dist, which does not match this flat Astro site's structure.
name: Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build site
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        name: Upload pages artifact
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        name: Deploy to GitHub Pages
