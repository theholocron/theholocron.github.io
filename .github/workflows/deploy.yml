# Hand-maintained — this repo IS the GitHub Pages site. The deploy-docs
# reusable workflow targets monorepos with <name>-site packages and uploads
# docs/dist, which does not match this flat Astro site's structure.
name: Deploy

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: theholocron/.github/.github/actions/setup@main
        name: Setup

      - name: Build site
        run: pnpm build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        name: Upload pages artifact
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        name: Deploy to GitHub Pages
